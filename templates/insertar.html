<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar persona</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <main class="container mt-5">
        <h1 class="mb-4">Registrar persona</h1>
{% if error %}
<div class="alert alert-danger" role="alert">
    {{ error }}
</div>
{% endif %}
        <form action="/guardar" method="post" class="row g-3">
            <div class="col-md-3">
                <label for="tipo_persona" class="form-label">Tipo de persona</label>
                <input id="tipo_persona" name="tipo_persona" class="form-control" placeholder="N o J" required>
            </div>

            <div class="col-md-9">
                <label for="nombres" class="form-label">Nombres</label>
                <input id="nombres" name="nombres" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="apaterno" class="form-label">Apellido paterno</label>
                <input id="apaterno" name="apaterno" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="amaterno" class="form-label">Apellido materno</label>
                <input id="amaterno" name="amaterno" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="razon_social" class="form-label">Razón social</label>
                <input id="razon_social" name="razon_social" class="form-control">
            </div>

            <div class="col-md-6">
                <label for="nombre_comercial" class="form-label">Nombre comercial</label>
                <input id="nombre_comercial" name="nombre_comercial" class="form-control">
            </div>

            <div class="col-md-4">
                <label for="id_tipo_documento" class="form-label">Código de tipo de documento</label>
                <input id="id_tipo_documento" name="id_tipo_documento" type="number" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="numero_documento" class="form-label">Número de documento</label>
                <input id="numero_documento" name="numero_documento" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label for="telefono" class="form-label">Teléfono</label>
                <input id="telefono" name="telefono" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Correo electrónico</label>
                <input id="email" name="email" type="email" class="form-control" required>
            </div>

            <div class="col-md-3">
                <label for="id_nacionalidad" class="form-label">Código de nacionalidad</label>
                <input id="id_nacionalidad" name="id_nacionalidad" type="number" class="form-control" required>
            </div>

            <div class="col-md-3">
                <label for="estado" class="form-label">Estado</label>
                <input id="estado" name="estado" class="form-control" placeholder="Activo" required>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="/" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
